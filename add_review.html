<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelMate - Submit Your Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">

    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0">
                    <a href="/" class="text-xl font-bold text-teal-700 tracking-wider flex items-center gap-1">
                        <span>TravelMate</span><span class="text-xs">🇱🇰</span>
                    </a>
                </div>
                <div class="flex space-x-8 text-sm font-medium">
                    <a href="/" class="text-gray-500 hover:text-teal-600 transition px-1 pt-1">Home</a>
                    <a href="/destinations" class="text-gray-500 hover:text-teal-600 transition px-1 pt-1">Destinations</a>
                    <a href="/reviews" class="text-teal-600 border-b-2 border-teal-600 px-1 pt-1">Reviews</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-4 py-16">
        
        <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-8">
            
            <div class="text-center mb-6">
                <div class="text-4xl mb-2">⭐</div>
                <h2 class="text-2xl font-extrabold text-gray-900">Submit Your Review</h2>
                <p class="text-sm text-gray-500 mt-1">
                    Reviewing as: <span class="font-semibold text-teal-600">👤 {{ session['user_name'] if session['user_name'] else 'Daniel' }}</span>
                </p>
            </div>

            <form method="POST" action="/submit_review" class="space-y-5">
                
                <input type="hidden" name="reviewer_name" value="{{ session['user_name'] if session['user_name'] else 'Daniel' }}">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Rating (1 to 5)</label>
                    <select name="rating" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 bg-white transition duration-200">
                        <option value="" disabled selected>Choose a rating...</option>
                        <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                        <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                        <option value="3">⭐⭐⭐ (3 - Average)</option>
                        <option value="2">⭐⭐ (2 - Poor)</option>
                        <option value="1">⭐ (1 - Terrible)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Your Review Comment</label>
                    <textarea name="comment" rows="4" placeholder="Write your genuine experience here..." required 
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition duration-200 resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition duration-200">
                    🚀 Submit Review
                </button>
            </form>

            <div class="text-center mt-5">
                <a href="/reviews" class="text-sm text-gray-400 hover:text-teal-600 transition">
                    Cancel & Go Back
                </a>
            </div>

        </div>

    </div>

</body>
</html>
